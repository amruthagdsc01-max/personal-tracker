# Render blueprint: one web service (Docker) + a free PostgreSQL database
services:
  - type: web
    name: ezze
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ezze-db
          property: connectionString
databases:
  - name: ezze-db
    plan: free
